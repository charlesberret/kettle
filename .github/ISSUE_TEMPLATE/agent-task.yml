name: Agent task
description: One outcome for a human or agent — checkable acceptance, single primary repo
title: "[P?] "
labels: ["agent-ok"]
body:
  - type: markdown
    attributes:
      value: |
        One issue = one outcome. Agents take only **Ready** + **agent-ok**.
        Prefer acceptance lines that map to [`docs/RELEASE.md`](../blob/main/docs/RELEASE.md) gate IDs.
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - P0
        - P1
        - P2
        - P3
        - P4
        - P5
    validations:
      required: true
  - type: dropdown
    id: repo
    attributes:
      label: Primary repo
      options:
        - home (kettle)
        - core (kettle-core)
        - vscode (kettle-vscode)
        - desktop
        - other
    validations:
      required: true
  - type: input
    id: surfaces
    attributes:
      label: Surfaces (labels)
      description: e.g. surface:cli, surface:chat — use both for signature spine work
      placeholder: surface:cli, surface:chat
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true when this is done?
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Paths / context
      description: Checkouts, files, commands to start from
      placeholder: ~/cloud/git-projects/kettle-vscode — read HANDOFF if local planning exists
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Explicitly out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Checkboxes; include gate IDs when applicable (G-core-test, M-dogfood-sit, …)
      value: |
        - [ ] 
        - [ ] `npm test` / `pytest` green in primary repo (if code)
        - [ ] No drive-by refactors outside paths above
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links to briefs, related issues, risks
