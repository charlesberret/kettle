name: Release gate
description: Track a single automated or manual gate toward a release bar
title: "[gate] "
labels: ["phase:P3"]
body:
  - type: markdown
    attributes:
      value: |
        One gate per issue. IDs and tables live in [`docs/RELEASE.md`](../blob/main/docs/RELEASE.md).
        Automated gates should be reflected in `scripts/release-ready.sh` when possible.
  - type: input
    id: gate_id
    attributes:
      label: Gate ID
      description: e.g. G-core-test, M-dogfood-sit
      placeholder: G-core-test
    validations:
      required: true
  - type: dropdown
    id: gate_kind
    attributes:
      label: Kind
      options:
        - gate:ci (automated / script)
        - gate:manual
        - gate:dogfood
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Release bar
      options:
        - "0.1"
        - "0.2"
        - "1.0"
        - other
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Procedure
      description: Exact commands or human steps
      value: |
        ```sh
        ./scripts/release-ready.sh --strict
        ```
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence when done
      description: CI URL, log snippet, or dogfood note
      value: |
        - [ ] Evidence attached or linked
